name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The checked-in *.gsx.go files are the golden output of the compiler and
      # are compiled into the e2e test binary, so they must be current.
      - name: Check generated files are up to date
        run: go run ./cmd/gsx -check ./...

      - name: Test
        run: go test ./...
