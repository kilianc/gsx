name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Format
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi

      - name: Vet
        run: go vet ./...

      # cmd/gsx-wasm is behind a js/wasm build tag, so the steps above skip it
      # entirely. Without this the playground could break and CI stay green.
      - name: Build for the browser
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/gsx-wasm

      # The checked-in *.gsx.go files are the golden output of the compiler and
      # are compiled into the e2e test binary, so they must be current.
      - name: Check generated files are up to date
        run: go run ./cmd/gsx -check ./...

      - name: Check sources are formatted
        run: go run ./cmd/gsx fmt -l ./...

      # The HTML tables are derived from the gomponents source, so a dependency
      # bump must be accompanied by a regenerated table.
      - name: Check generated HTML tables are up to date
        run: |
          go generate ./...
          git diff --exit-code -- '*_tables.go' 'internal/gsx/playground/symbols'

      # -race, because the LSP proxy is concurrent by construction: it pumps
      # messages on one goroutine, answers some itself, and runs compiling and
      # formatting under a watchdog that abandons work it cannot stop. The
      # detector already caught one real bug there — an abandoned goroutine
      # still reading a package variable the caller had moved on from — which a
      # passing suite reported as green. It costs about three seconds.
      - name: Test
        run: go test -race ./...

      # A parse loop that consumes nothing spins forever rather than failing, so
      # it cannot be caught by asserting on output — the symptom is a wedged
      # process, not a wrong answer. The seed corpus runs above with the other
      # tests; this looks for shapes nobody thought to seed. The timeout is the
      # backstop: if an input ever does hang outright, the run fails with a
      # stack trace pointing at the loop instead of hanging the job.
      - name: Fuzz the parser for hangs
        run: |
          go test ./internal/gsx/parse -timeout 5m \
            -run FuzzRewriteTagsMakesProgress \
            -fuzz FuzzRewriteTagsMakesProgress -fuzztime 60s

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A TextMate grammar cannot be verified by reading it, so the fixtures are
      # tokenized with the same engine VS Code uses.
      - name: Build tools image
        run: docker build -f tools/Dockerfile -t gsx-tools .

      - name: Grammar tokenization
        run: make grammar-test

      - name: Extension tests
        run: make extension-test

      - name: Typecheck extension
        run: make extension-check

      # Packaging is the one step that cannot be verified in a constrained
      # sandbox — installing webpack and vsce needs a working npm — so CI is
      # where it gets proven, and the artifact is what people install.
      - name: Package extension
        run: make vsix

      - uses: actions/upload-artifact@v4
        with:
          name: gsx-vscode
          path: vscode/gsx-vscode/*.vsix
          if-no-files-found: error
