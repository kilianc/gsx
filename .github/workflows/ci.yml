name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Clean generated files
        run: |
          rm -rf ./**/*.gsx.go
          rm -rf ./**/*.html

      - name: Test (generate + compare)
        run: go test ./...

      - name: Test again (verify HTML output)
        run: go test ./...
