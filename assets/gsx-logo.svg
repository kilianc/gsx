<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 80" width="238" height="80" role="img" aria-label="gsx">
  <title>gsx</title>
  <!--
    The mark is a curly brace whose pinch is an angle bracket: markup living
    inside a Go expression, which is the whole idea of the language. The braces
    hug the wordmark the way `{ }` hugs a spliced value.

    Geometry: 80-unit box, 8-unit monoline strokes, x-height 28 on a baseline
    at y=54. Letters are drawn as paths so the file needs no font.
  -->
